<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстр ПЗ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Реєстр програмного забезпечення</h1>

        <div id="notice" style="color: red; margin-bottom: 10px; font-weight: bold;"></div>
        
        <div id="listStatus" style="margin-bottom: 10px; font-style: italic;"></div>

        <table>
            <thead>
                <tr>
                    <th data-sort="name" style="cursor: pointer;">Name</th>
                    <th data-sort="version" style="cursor: pointer;">Version</th>
                    <th data-sort="licenseType" style="cursor: pointer;">LicenseType</th>
                    <th data-sort="seats" style="cursor: pointer;">Seats</th>
                    <th data-sort="comment" style="cursor: pointer;">Comment</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>

        <h2>Додати програму</h2>
        <form id="softwareForm">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="field1Input" required>
            </div>
            <div class="form-group">
                <label>Version</label>
                <input type="text" id="field2Input" required>
            </div>
            <div class="form-group">
                <label>License Type</label>
                <select id="field3Select">
                    <option value="Free">Free</option>
                    <option value="Academic">Academic</option>
                    <option value="Commercial">Commercial</option>
                </select>
            </div>
            <div class="form-group">
                <label>Seats</label>
                <input type="number" id="field4Text" required min="0">
            </div>
            <div class="form-group">
                <label>Comment</label>
                <textarea id="field5Text" rows="3"></textarea>
            </div>
            <button type="submit">Додати</button>
        </form>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
